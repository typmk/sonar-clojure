<h2>Why is this an issue?</h2>
<p><code>re-find</code> succeeds anywhere in the string. A pattern anchored with <code>^</code> and <code>$</code> was written to match a whole value, so handing it to <code>re-find</code> silently weakens it to a substring test.</p>
<h2>How can I fix it?</h2>
<pre>(re-matches #"^[a-z0-9-]+$" v)   ; not re-find</pre>
