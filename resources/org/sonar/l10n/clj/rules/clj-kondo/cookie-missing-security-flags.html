<h2>Why is this an issue?</h2>
<p>Without <code>:http-only</code> a session cookie is readable by script; without <code>:secure</code> it travels in clear text.</p>
<h2>How can I fix it?</h2>
<pre>{:secure true :http-only true :same-site :strict}</pre>
