name: integration

# The unit suite runs the sensors against SonarSource's in-memory
# SensorContextTester, which proves the calls are shaped right and nothing
# about whether a real SonarQube loads the plugin at all.
#
# It did not. Measured on 2026-08-04, against a jar that passed every unit test:
#
#   SonarQube 10.7  -- ClassNotFoundException on PropertyDefinition$ConfigScope,
#                      and the server did not start. The manifest declared a
#                      floor of 10.0; ConfigScope arrives in plugin API 10.13.
#   SonarQube 24.12 -- web server fine, Compute Engine dead:
#                      AccessControlException on getClassLoader, which is the
#                      classloader swap the Clojure bootstrap cannot work without.
#
# Neither is reachable from a unit test. Hence this workflow.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    # Versions listed here are ones the plugin has been observed to work on.
    # 25.1 through 25.5 are untested, not known-good.
    strategy:
      fail-fast: false
      matrix:
        sonarqube:
          - 25.6.0.109173-community
          - 26.1.0.118079-community
          - 26.7.0.124771-community

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: DeLaGuardo/setup-clojure@13.4
        with: { cli: latest, clj-kondo: latest }
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: cdeps-${{ hashFiles('deps.edn') }}
          restore-keys: cdeps-

      - name: Build the plugin and the reports it reads
        run: |
          clojure -T:build uber
          clj-kondo --lint src test --config '{:output {:format :json}}' \
            > target/clj-kondo.json || true
          clj-kondo --lint src test \
            --config '{:output {:format :json :analysis {:locals true :keywords true}}}' \
            > target/clj-kondo-analysis.json || true

      - name: Start SonarQube ${{ matrix.sonarqube }} with the plugin installed
        run: |
          docker run -d --name sq -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:${{ matrix.sonarqube }}
          # The plugin directory only exists once the image has unpacked, so
          # the jar goes in after first boot and the server is restarted.
          timeout 300 bash -c 'until curl -sf localhost:9000/api/system/status | grep -q UP; do sleep 5; done'
          docker cp target/sonar-clojure-plugin-*.jar sq:/opt/sonarqube/extensions/plugins/
          docker restart sq
          timeout 300 bash -c 'until curl -sf localhost:9000/api/system/status | grep -q UP; do sleep 5; done'

      - name: The Compute Engine loaded the plugin too
        # 24.12 passed a web-server health check while its Compute Engine was
        # already dead, so "UP" is not evidence on its own.
        run: |
          docker logs sq 2>&1 | grep -q "Fail to load plugin Clojure" \
            && { docker logs sq 2>&1 | grep -A20 "Fail to load plugin Clojure"; exit 1; }
          docker logs sq 2>&1 | grep -q "AccessControlException" \
            && { echo "::error::SecurityManager denied the classloader swap"; exit 1; }
          echo "provenance lines: $(docker logs sq 2>&1 | grep -c 'sonar-clojure:')"

      - name: Bootstrap a token
        run: |
          curl -sf -u admin:admin -X POST localhost:9000/api/users/change_password \
            -d "login=admin&previousPassword=admin&password=Sq-Integration-2026"
          echo "SONAR_TOKEN=$(curl -sf -u admin:Sq-Integration-2026 -X POST \
            'localhost:9000/api/user_tokens/generate?name=ci' | jq -r .token)" >> $GITHUB_ENV

      - name: Clojure is a language the server knows about
        run: |
          curl -sf -u "$SONAR_TOKEN:" localhost:9000/api/languages/list \
            | jq -e '.languages[] | select(.key=="clj")'

      - name: Scan, with coverage deliberately withheld
        # The point of clj_analysis_completeness is that a missing report is
        # visible. Withholding one is the only way to see that it is.
        run: |
          docker run --rm --network=host -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN="$SONAR_TOKEN" \
            sonarsource/sonar-scanner-cli -Dsonar.projectKey=it
          # Two waits, because there are two stores. Measures land in the
          # database when the Compute Engine task finishes; issues are searched
          # through Elasticsearch, which settles afterwards. Waiting only on the
          # measure made the issue assertion flaky -- it passed once and failed
          # twice on identical inputs.
          #
          # Requires a positive number, not merely a non-"0" string: curl -sf on
          # an error emits an empty body, and an empty body compared as a string
          # is not "0", which would read as ready.
          timeout 180 bash -c 'until curl -sf -u "'"$SONAR_TOKEN"':" \
            "localhost:9000/api/measures/component?component=it&metricKeys=ncloc" \
            | jq -e ".component.measures[0].value | tonumber > 0" >/dev/null 2>&1; do sleep 5; done'
          timeout 120 bash -c 'until [ "$(curl -sf -u "'"$SONAR_TOKEN"':" \
            "localhost:9000/api/ce/component?component=it" | jq -r ".queue | length")" = "0" ]; do sleep 3; done'

      - name: Files were indexed, and the missing report was reported
        run: |
          m() { curl -sf -u "$SONAR_TOKEN:" \
            "localhost:9000/api/measures/component?component=it&metricKeys=$1" \
            | jq -r '.component.measures[0].value // "absent"'; }
          echo "ncloc=$(m ncloc) completeness=$(m clj_analysis_completeness) coverage=$(m coverage)"
          [ "$(m ncloc)" -gt 0 ] || { echo "::error::nothing was indexed as Clojure"; exit 1; }
          [ "$(m clj_analysis_completeness)" = "50.0" ] \
            || { echo "::error::expected 50.0 completeness with 2 of 4 reports present"; exit 1; }
          # Polled, not sampled once: the issue index settles after the CE task.
          # The URL is repeated rather than held in a shell function because a
          # function does not survive into `bash -c`.
          ISSUES="localhost:9000/api/issues/search?components=it&rules=clj-kondo:incomplete-analysis"
          export ISSUES SONAR_TOKEN
          timeout 90 bash -c \
            'until [ "$(curl -sf -u "$SONAR_TOKEN:" "$ISSUES" | jq -r .total)" != "0" ]; do sleep 3; done' \
            || true
          total=$(curl -sf -u "$SONAR_TOKEN:" "$ISSUES" | jq -r '.total')
          echo "incomplete-analysis issues: $total"
          [ "$total" = "1" ] \
            || { echo "::error::expected exactly 1 incomplete-analysis issue, got $total"; exit 1; }

      - name: Supplying the report moves the number
        # A check that cannot change its answer is not measuring anything.
        run: |
          clojure -M:coverage
          docker run --rm --network=host -v "$PWD:/usr/src" \
            -e SONAR_HOST_URL=http://localhost:9000 -e SONAR_TOKEN="$SONAR_TOKEN" \
            sonarsource/sonar-scanner-cli -Dsonar.projectKey=it
          sleep 20
          got=$(curl -sf -u "$SONAR_TOKEN:" \
            "localhost:9000/api/measures/component?component=it&metricKeys=clj_analysis_completeness" \
            | jq -r '.component.measures[0].value')
          echo "completeness after supplying coverage: $got"
          [ "$got" = "75.0" ] || { echo "::error::expected 75.0, got $got"; exit 1; }

  floor-is-enforced:
    # The manifest's Sonar-Version is a claim about what will refuse to load it.
    # Declaring 10.0 did not stop 10.7 from accepting the plugin and dying; it
    # is only worth declaring if something checks that it bites.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: DeLaGuardo/setup-clojure@13.4
        with: { cli: latest }
      - run: clojure -T:build uber

      - name: SonarQube 10.7 refuses the plugin by version, not by crashing
        run: |
          docker run -d --name old -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true sonarqube:10.7-community
          timeout 300 bash -c 'until curl -sf localhost:9000/api/system/status | grep -q UP; do sleep 5; done'
          docker cp target/sonar-clojure-plugin-*.jar old:/opt/sonarqube/extensions/plugins/
          docker restart old
          timeout 240 bash -c 'until docker logs old 2>&1 | grep -q "requires at least Sonar Plugin API"; do
            docker inspect -f "{{.State.Running}}" old | grep -q true || break; sleep 5; done'
          docker logs old 2>&1 | grep "requires at least Sonar Plugin API" \
            || { echo "::error::10.7 did not refuse the plugin on version grounds"; exit 1; }
          docker logs old 2>&1 | grep -q "ClassNotFoundException" \
            && { echo "::error::it loaded far enough to crash; the declared floor is too low"; exit 1; }
          echo "refused cleanly"
