sonar.projectKey=sonar-clojure
sonar.projectName=sonar-clojure
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.clojure.kondo.reportPaths=target/clj-kondo.json
sonar.clojure.kondo.analysisPaths=target/clj-kondo-analysis.json
sonar.clojure.cloverage.reportPaths=target/coverage/codecov.json

# REQUIRED. The plugin's Language extension declares these via
# filenamePatterns(), and the scanner logs "Declared patterns of language
# Clojure were converted to sonar.lang.patterns.clj :" with nothing after the
# colon -- so it claims no files, detects 0 languages and skips every sensor,
# silently. Verified against SonarQube 26.7 with the patterns correct in the
# shipped jar (probed directly) and unaffected by a second server restart.
# Until that is understood, declaring them here is what makes analysis work.
sonar.lang.patterns.clj=**/*.clj,**/*.cljs,**/*.cljc,**/*.edn,**/*.bb
