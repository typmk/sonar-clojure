sonar.projectKey=sonar-clojure
sonar.projectName=sonar-clojure
sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

sonar.clojure.kondo.reportPaths=target/clj-kondo.json
sonar.clojure.kondo.analysisPaths=target/clj-kondo-analysis.json
sonar.clojure.cloverage.reportPaths=target/coverage/codecov.json


# Must mirror the :coverage alias's -e list in deps.edn. Without it Sonar
# counts namespaces cloverage never instrumented as wholly uncovered, and the
# dashboard disagrees with the tool that produced the report -- measured 52.2%
# against cloverage's 73.9% on the same run. Two numbers for one fact is one
# number too many.
sonar.coverage.exclusions=\
  src/net/typemark/sonar/plugin.clj,\
  src/net/typemark/sonar/language.clj,\
  src/net/typemark/sonar/rules.clj,\
  src/net/typemark/sonar/profile.clj,\
  src/net/typemark/sonar/sensor.clj,\
  src/net/typemark/sonar/source_sensor.clj,\
  src/net/typemark/sonar/coverage_sensor.clj,\
  src/net/typemark/sonar/test_sensor.clj,\
  src/net/typemark/sonar/completeness_sensor.clj,\
  src/net/typemark/sonar/external_sensor.clj,\
  src/net/typemark/sonar/external_rules.clj,\
  src/net/typemark/sonar/metrics_def.clj,\
  src/net/typemark/sonar/gen.clj
